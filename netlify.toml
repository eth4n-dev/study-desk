[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_OPEN_SIGNUP_DOMAINS = "ethz.ch,etu.unige.ch"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"
